<!DOCTYPE html>

<html>

<head>

    <title>Login - FinTech Simulator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {

            background: #1e293b;

            width: 90%;
            max-width: 400px;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.35);

        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: none;

            border-radius: 8px;

            background: #334155;

            color: white;

            font-size: 15px;

        }

        input::placeholder {
            color: #94a3b8;
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #22c55e;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {
            opacity: 0.85;
        }

        .register {

            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

        }

        a {
            color: #22c55e;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-box">

    <h1>
        📊 FinTech Simulator
    </h1>


    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </div>


</div>


</body>

</html>
